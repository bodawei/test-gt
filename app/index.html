<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fibonacci Finder</title>
</head>
<body>
  <h1>Fibonacci Finder</h1>
  <form id="search-form">
    <label for="number-input">Enter a non-negative integer:</label>
    <input
      type="text"
      id="number-input"
      name="number"
      autocomplete="off"
      aria-describedby="error"
    >
    <button type="submit">Find</button>
  </form>
  <div id="error" role="alert" hidden></div>
  <div id="result" hidden></div>
</body>
</html>
